[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pmwallets"
version = "0.7.0"
description = "Official PMWallets SDK and CLI: Polymarket smart-money leaderboard, real-time wallet fills over WebSocket with gap replay, webhooks, exports — and a CLI + MCP server so AI agents (Claude Code, Codex, Cursor, …) can follow traders and act on their fills."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["polymarket", "copy-trading", "wallet-tracker", "smart-money", "pmwallets", "prediction-markets", "mcp", "ai-agent", "claude-code", "codex"]
dependencies = ["httpx>=0.27", "websockets>=15"]

[project.scripts]
pmwallets = "pmwallets.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://pmwallets.com/docs"
Repository = "https://github.com/polymarketwallets/pmwallets-python"
Issues = "https://github.com/polymarketwallets/pmwallets-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pmwallets"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
